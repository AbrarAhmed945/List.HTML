<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Lists</title>
</head>

<body>
    <h2>an ordered HTML list:</h2>
    <ol>
        <li>Apple</li>
        <li>Mango</li>
        <li>StrawBerry</li>
        <li>Lichi</li>
    </ol>

    <h2>an unordered HTML list:</h2>
<ul>
    <li>Football</li>
    <li>Cricket</li>
    <li>Running</li>
    <li>Swimming</li>
</ul>

<h2>Definition list:</h2>
<dl>    
    <dt>Tea</dt>
    <dd>- hot drink</dd>

    <dt>Juice</dt>
    <dd>- ice drink</dd>
</dl>
</body>
</html>
